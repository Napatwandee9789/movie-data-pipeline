
# Name your project! Project names should contain only lowercase characters
# and underscores. A good package name should reflect your organization's
# name or the intended use of these models
name: 'data_transformation_dbt'
version: '1.0.0'

# This setting configures which "profile" dbt uses for this project.
profile: 'movie_data_lakehouse'

# These configurations specify where dbt should look for different types of files.
# The `model-paths` config, for example, states that models in this project can be
# found in the "models/" directory. You probably won't need to change these!
model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]

clean-targets:         # directories to be removed by `dbt clean`
  - "target"
  - "dbt_packages"


models:
  data_transformation_dbt:
    staging:
      +materialized: view
      +tags: ["daily_run"]

    intermediate:
      +materialized: view
      +tags: ["daily_run"]

    marts:
      +table_type: iceberg
      +format: parquet
      
      dimensions:
        +tags: ["daily_run"]
      
      bridges:
        +tags: ["daily_run"]
      
      facts:
        fact_movie_daily_engagement_30d:
          +tags: ["daily_run"]


    serving:
          +schema: dashboard_serving   
          +materialized: table
          +table_type: hive            
          +format: parquet
          +tags: ["monthly_run"]
          summary_engagement_metrics:
                  +external_location: 's3://my-personal-movie-data-lake/gold/dashboard_serving/summary_engagement_metrics/'
                  +partitioned_by: ['genre']
          summary_keyword_tf_idf:
                  +external_location: 's3://my-personal-movie-data-lake/gold/dashboard_serving/summary_keyword_tf_idf/'
                  +partitioned_by: ['genre']
          summary_financial_metrics:
                  +partitioned_by: ['release_year']
                  +external_location: 's3://my-personal-movie-data-lake/gold/dashboard_serving/summary_financial_metrics/'