name: Deploy Worker Lambda On AWS Lambda

on:
  push:
    branches:
      - main  # สั่งให้ทำงานอัตโนมัติทุกครั้งที่มีการ push ขึ้น branch main
    paths:
      - 'worker_for_daily_changes/**'

jobs:
  deploy-worker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag, and Push Worker Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: movie-pipeline-lambda-worker
          IMAGE_TAG: latest
        working-directory: ./worker_for_daily_changes
        run: |
          docker build --platform linux/amd64 --provenance=false -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      - name: Update Worker Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name movie-pipeline-lambda-worker \
            --image-uri ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/movie-pipeline-lambda-worker:latest