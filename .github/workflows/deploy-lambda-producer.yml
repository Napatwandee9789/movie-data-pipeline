name: Deploy Producer Lambda On AWS Lambda

on:
  # ทำงานอัตโนมัติทุกครั้งที่มีการ push โค้ดขึ้น branch main
  push:
    branches:
      - main
    # จำกัดให้รันเฉพาะเมื่อมีการแก้ไขไฟล์ในโฟลเดอร์ของ Producer เท่านั้น
    paths:
      - 'producer_for_daily_changes/**'

jobs:
  deploy-producer:
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดล่าสุดจาก Repository ลงมาใน Runner ของ GitHub
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. ยืนยันตัวตนเข้าสู่ระบบ AWS เพื่อขอสิทธิ์ใช้งาน ECR และ Lambda
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 3. ล็อกอินเข้าสู่ Amazon ECR (ที่เก็บ Docker Image บน AWS)
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4. สร้าง Docker Image จากโค้ด Producer และอัปโหลดขึ้นไปเก็บไว้ใน ECR
      - name: Build, Tag, and Push Producer Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: movie-pipeline-lambda-producer
          IMAGE_TAG: latest
        working-directory: ./producer_for_daily_changes  # เข้าไปทำงานในโฟลเดอร์ของ Producer
        run: |
          # Build Image สำหรับสถาปัตยกรรม linux/amd64 (ปิด provenance เพื่อป้องกันปัญหา Lambda อ่าน Manifest ไม่ออก)
          docker build --platform linux/amd64 --provenance=false -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          # อัปโหลด Image ขึ้นไปบน Amazon ECR
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG

      # 5. สั่งให้ AWS Lambda ดึง Docker Image ตัวล่าสุดจาก ECR ไปอัปเดตทับของเดิม
      - name: Update Producer Lambda Function Code
        run: |
          aws lambda update-function-code \
            --function-name movie-pipeline-lambda-producer \
            --image-uri ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com/movie-pipeline-lambda-producer:latest

# ==================================================================================
#   CI/CD DEPLOYMENT ARCHITECTURE: PRODUCER LAMBDA (CONTAINER IMAGE)
# ==================================================================================
#
#   [Developer] ──(git push)──▶ [GitHub Repo: movie-data-pipeline]
#                                              │
#                             (Changes detected in 'producer_for_daily_changes/**')
#                                              │
#                                              ▼
#                                 [GitHub Actions Workflow]
#                                              │
#                                              ├──▶ 1. Authenticate with AWS & Amazon ECR
#                                              │
#                                              ├──▶ 2. Build Docker Image (linux/amd64)
#                                              │
#                                              ├──▶ 3. Push Image to Amazon ECR
#                                              │       (movie-pipeline-lambda-producer:latest)
#                                              │
#                                              ▼
#                        4. Update AWS Lambda Function with Latest Image
#                                              │
#                                              ▼
#                         [AWS Lambda: movie-pipeline-lambda-producer]
#                                     (Ready for invocation)
#
# ==================================================================================