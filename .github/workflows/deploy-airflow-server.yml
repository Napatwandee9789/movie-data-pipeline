name: Deploy Airflow & dbt On AWS EC2

on:
  push:
    branches:
      - main
    paths:
      - 'airflow/**'
      - 'data_transformation_dbt/**'
      - 'tests/**'
  pull_request:
    branches:
      - main
    paths:
      - 'airflow/**'
      - 'data_transformation_dbt/**'
      - 'tests/**'

jobs:
  # ==========================================
  # Step 1: CI (Automated Testing)
  # ==========================================
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest apache-airflow==2.9.3

      - name: Run Airflow DAG Integrity Tests
        env:
          # ป้องกันไม่ให้ Airflow พยายามต่อ Database จริงขณะรันเทส
          AIRFLOW__CORE__LOAD_EXAMPLES: 'False'
          AIRFLOW__CORE__UNIT_TEST_MODE: 'True'
        run: |
          pytest tests/test_airflow_dags.py -v

  # ==========================================
  # Step 2: CD (Deploy to EC2 via SSH)
  # ==========================================
  deploy-to-ec2:
    runs-on: ubuntu-latest
    needs: ci-test  # ต้องผ่าน ci-test ก่อนเท่านั้นถึงจะรัน job นี้
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_AIRFLOW_SERVER_HOST }}
          username: ${{ secrets.EC2_AIRFLOW_SERVER_USER }}
          key: ${{ secrets.EC2_AIRFLOW_SERVER_SSH_KEY }}
          port: ${{ secrets.EC2_AIRFLOW_SERVER_PORT }}
          script: |
            cd ~/movie-data-pipeline
            git pull origin main
            cd airflow
            docker compose up -d --build